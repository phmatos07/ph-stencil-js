<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>

    <style>
      :where(p) {
        color: red;
        font-style: italic;
      }
      :is(h1, h2, h3, p) {
        color: darkblue;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <article>
      <h1>Título principal</h1>
      <h2>Subtítulo</h2>
      <p>Parágrafo dentro de um article.</p>
    </article>
  </body>
</html>
